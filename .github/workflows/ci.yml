name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Build & Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Web Frontend
        run: npm run build

      - name: Test Backend API
        run: |
          npm --prefix backend ci
          npm --prefix backend run smoke

      - name: Test Data API
        run: |
          npm --prefix data-api ci
          npm --prefix data-api run smoke
