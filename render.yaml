services:
  - type: web
    name: novashop-api
    runtime: node
    region: singapore
    plan: free
    autoDeployTrigger: "true"
    buildCommand: npm --prefix backend ci --omit=dev && npm --prefix data-api ci --omit=dev
    startCommand: npm run start:hosting
    healthCheckPath: /api/v1/ready
    envVars:
      - key: NODE_VERSION
        value: 24.12.0
      - key: NODE_ENV
        value: production
      - key: DATA_API_KEY
        generateValue: true
      - key: SELLER_IDENTITY_KEY
        sync: false
      - key: SELLER_IDENTITY_PREVIOUS_KEYS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_ENABLED
        value: "true"
      - key: DB_SSL_CA
        value: /etc/secrets/tidb-ca.pem
      - key: DEMO_LOGIN_ENABLED
        value: "false"
      - key: UPLOAD_STORAGE
        value: s3
      - key: S3_ENDPOINT
        value: https://b22e8e960cbcf735cefc1ecea1aa5cd7.r2.cloudflarestorage.com
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: shopnova-media
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"
